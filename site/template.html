<style>
/* Layout: one column. The list answers "who wins"; the detail page answers
   "by how much"; everything explanatory hides behind a disclosure. */
:root{
  --bg:#0A1628; --surface:#112038; --surface-2:#1A2B47; --line:#283D60;
  --fg:#F5F7FB; --muted:#BAC6D9; --faint:#8E9FBB;
  /* Gold = home / above average, light blue = away / below. Both are labelled in
     text as well, because red-green is the common colour-vision deficiency
     and colour must never be the only carrier of meaning. */
  --accent:#F5B82E; --accent-dim:#C8901A; --accent-ghost:rgba(245,184,46,.15);
  --red:#6CB8FF; --red-dim:#3D8FE0; --red-ghost:rgba(108,184,255,.15);
  --draw:#94A3BC;
  --warn:#FF7A45;
  --display:'Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --data:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}
.n{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------- header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:rgba(10,22,40,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:9px;padding-block:13px 9px}
.mark{width:24px;height:24px;border-radius:7px;flex:none;
  background:linear-gradient(145deg,var(--accent),var(--accent-dim));
  display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:13px;color:#0A1628}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.015em}
.mark{box-shadow:0 0 0 1px rgba(245,184,46,.25)}
.sub{color:var(--faint);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;margin-left:auto}
nav{display:flex;gap:4px;padding-bottom:9px}
nav button{flex:1;appearance:none;cursor:pointer;font-family:var(--body);font-size:13px;
  font-weight:600;padding:7px 4px;border-radius:9px;background:transparent;
  color:var(--muted);border:1px solid transparent}
nav button[aria-selected="true"]{background:var(--accent-ghost);color:var(--accent);
  border-color:rgba(245,184,46,.28)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ----------------------------------------------------------------- chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted);font-family:var(--body)}
button.chip{cursor:pointer}
.chip.on{background:var(--accent-ghost);border-color:rgba(245,184,46,.3);color:var(--accent)}
.picker{margin-block:12px}

/* -------------------------------------------------------------- fixtures */
.fx{display:block;width:100%;text-align:left;appearance:none;border:1px solid var(--line);
  background:var(--surface);color:inherit;font:inherit;cursor:pointer;
  border-radius:13px;padding:13px;margin-bottom:8px}
.fx:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ko{color:var(--faint);font-size:10.5px;font-family:var(--data);letter-spacing:.02em}
.teams{font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;
  margin:4px 0 9px;line-height:1.3}
.vs{color:var(--faint);font-weight:600;margin-inline:5px}
.bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block}
.ph{background:var(--accent)}.pd{background:var(--draw)}.pa{background:var(--red)}
.odds{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.odds b{color:var(--fg);font-weight:600;font-family:var(--data)}
.quick{color:var(--faint);font-size:11px;font-family:var(--data);margin-top:7px}

/* ---------------------------------------------------------------- detail */
.back{appearance:none;background:none;border:0;color:var(--accent);font:inherit;
  font-size:13px;font-weight:600;cursor:pointer;padding:12px 0}
.dhead h2{font-size:21px;letter-spacing:-.02em;line-height:1.2}
.dmeta{color:var(--faint);font-size:11.5px;margin-top:5px;font-family:var(--data)}
section{margin-top:20px}
.hd{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;
  align-items:baseline;gap:10px}
.hd em{font-style:normal;text-transform:none;letter-spacing:0;font-size:11px}

/* A compact label/value row — replaces the tile grids. */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:8px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv .k{font-size:13px;color:var(--muted);min-width:0}
.kv .v{font-family:var(--data);font-size:14px;font-weight:500;white-space:nowrap}
.kv .v small{color:var(--faint);font-size:11.5px;font-weight:400;margin-left:6px}

.scores{display:flex;gap:6px;flex-wrap:wrap}
.score{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-family:var(--data);font-size:13px}
.score span{color:var(--faint);font-size:11px;margin-left:5px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);font-weight:600;padding:0 0 7px 8px;white-space:nowrap}
th:first-child{text-align:left;padding-left:0}
td{padding:7px 0 7px 8px;border-top:1px solid var(--line);text-align:right;
  font-family:var(--data);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{text-align:left;padding-left:0;font-family:var(--body);width:100%;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.who{font-weight:500}
.sub2{color:var(--faint);font-size:10.5px}
.dim{color:var(--faint)}

/* Disclosures carry every explanation, so the page stays answers-first. */
details{margin-top:8px}
details>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:12px;
  display:inline-flex;align-items:center;gap:5px;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"＋";font-family:var(--data);color:var(--faint);font-size:11px}
details[open]>summary::before{content:"－"}
details>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.body{font-size:12.5px;color:var(--muted);line-height:1.55;padding:4px 0 2px}
.body p{margin:0 0 8px}
.body p:last-child{margin-bottom:0}

details.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  margin-bottom:7px;margin-top:0}
details.card>summary{display:flex;justify-content:space-between;align-items:baseline;
  gap:9px;padding:11px 13px;color:var(--fg);font-size:14px}
details.card>summary::before{content:none}
details.card[open]>summary{border-bottom:1px solid var(--line)}
.cname{font-family:var(--display);font-weight:700;font-size:14.5px}
.cmeta{font-size:11px;color:var(--muted);text-align:right;min-width:0}
.cbody{padding:10px 13px 13px}

.tag{font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;
  border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--accent-ghost);color:var(--accent)}
.tag.warn{background:rgba(255,122,69,.15);color:var(--warn)}

/* Style dimension bar: centre is the league average. */
.dimrow{padding:8px 0;border-top:1px solid var(--line)}
.dimrow:first-child{border-top:0}
.dimtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dimlab{font-size:12.5px;font-weight:500}
.dimval{font-family:var(--data);font-size:12px;color:var(--muted);white-space:nowrap}
.zbar{position:relative;height:5px;background:var(--surface-2);border-radius:3px;margin-top:5px}
.zbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;
  background:var(--faint);opacity:.5}
.zbar i{position:absolute;top:0;height:100%;border-radius:3px;background:var(--accent)}
/* Below average is not 'bad' for a style dimension, so the
   negative bar is a muted slate rather than the alert red. */
.zbar i.neg{background:#6E8B9E}
.dimnote{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.45}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--faint);margin-top:7px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.big{font-family:var(--data);font-size:28px;font-weight:500;letter-spacing:-.02em}
.bigrow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;margin-bottom:4px}
.biglab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.cols{grid-template-columns:1fr}}
.col{min-width:0}
.scroller{overflow-x:auto}
footer{color:var(--faint);font-size:11px;padding-block:20px 32px;border-top:1px solid var(--line);
  margin-top:24px;line-height:1.6}
[hidden]{display:none!important}

/* ------------------------------------------------------------ readability
   One typeface (Inter) everywhere, nothing smaller than 11px, and
   tabular figures so numbers line up in columns. */
body{font-size:16px;line-height:1.55}
h1,h2,.brand,.teams,.cname{letter-spacing:-.015em}
.brand{font-size:19px}
.sub{font-size:12px;letter-spacing:.06em}
nav button{font-size:14.5px;padding:9px 4px}
.chip{font-size:12.5px;padding:4px 11px}
.ko{font-size:12.5px;letter-spacing:0}
.teams{font-size:17.5px;margin:5px 0 10px}
.bar{height:8px}
.odds{font-size:13.5px;margin-top:8px}
.odds b{font-weight:700}
.quick{font-size:13px;color:var(--muted)}
.back{font-size:14.5px}
.dhead h2{font-size:25px}
.dmeta{font-size:13px}
.hd{font-size:12px;letter-spacing:.08em}
.hd em{font-size:12.5px}
.kv{padding:10px 0}
.kv .k{font-size:14.5px}
.kv .v{font-size:15.5px;font-weight:600}
.kv .v small{font-size:13px}
.score{font-size:15px;padding:8px 11px}
.score span{font-size:12.5px}
table{font-size:15px}
th{font-size:11.5px}
td{padding:9px 0 9px 8px}
.sub2{font-size:12.5px}
details>summary{font-size:14px}
.body{font-size:14.5px;line-height:1.6}
details.card>summary{font-size:15px}
.cname{font-size:16px}
.cmeta{font-size:12.5px}
.tag{font-size:11px;padding:2px 7px}
.dimlab{font-size:14.5px}
.dimval{font-size:13.5px}
.dimnote{font-size:13.5px!important;line-height:1.55}
.legend{font-size:12.5px}
.big{font-size:32px;font-weight:700}
.biglab{font-size:12px}
footer{font-size:13px}
.chart text{font-size:11px;font-family:var(--data)}
.n,.ko,.odds b,.quick,.dmeta,.kv .v,.score,td,.dimval,.big,.chart text,.rscore{
  font-variant-numeric:tabular-nums}

/* recent results */
.res{padding:11px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.resrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:baseline;
  margin:3px 0 5px}
.rteam{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.rteam.a{text-align:right}
.rscore{font-weight:800;font-size:17px;padding:2px 10px;border-radius:7px;
  background:var(--surface-2)}
.rverdict{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.rverdict b{color:var(--fg)}

/* player table: fixed number columns so all three fit on a phone */
table{table-layout:fixed}
th:not(:first-child),td:not(:first-child){width:60px}
td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td .sub2{display:block;margin-top:1px}
td .who{display:block;overflow:hidden;text-overflow:ellipsis}

/* detail header: back + share */
.dbar{display:flex;justify-content:space-between;align-items:center}
.share{appearance:none;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  color:var(--accent);background:var(--accent-ghost);border:1px solid rgba(245,184,46,.3);
  border-radius:999px;padding:6px 14px}
.share:focus-visible,.back:focus-visible,.chip:focus-visible,.fx:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.dhead h2:focus{outline:none}
</style>
</head>
<body>
<noscript><p style="padding:24px;color:#F5F7FB;font-family:sans-serif">PitchLab needs JavaScript to show its forecasts.</p></noscript>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="mark">P</div>
      <div class="brand">PitchLab</div>
      <div class="sub" id="sub"></div>
    </div>
    <nav role="tablist">
      <button role="tab" id="t-fixtures" aria-selected="true">Fixtures</button>
      <button role="tab" id="t-accuracy" aria-selected="false">Accuracy</button>
      <button role="tab" id="t-styles" aria-selected="false">Styles</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="view-fixtures"></div>
  <div id="view-detail" hidden></div>
  <div id="view-accuracy" hidden></div>
  <div id="view-styles" hidden></div>
  <div id="view-legal" hidden></div>
  <footer id="foot"></footer>
</main>

<script>
const DATA = /*__PITCHLAB_DATA__*/null;
const LEGAL = [{"h": "What this is", "b": "PitchLab is a statistical information tool. It does not accept, place, settle or facilitate bets, it holds no money, and it has no commercial relationship with any wagering operator."}, {"h": "How the numbers are made", "b": "Every figure is a probability produced by a statistical model from publicly available past results. Probabilities are estimates about future events, not statements of fact and not guarantees. The grounds for them are published in full on the Accuracy tab: each forecast is written to a ledger before kickoff, scored after the match, and measured by log loss, Brier score and calibration against a baseline."}, {"h": "Not advice", "b": "Nothing here is betting, financial or professional advice, and nothing here is a recommendation to place a bet."}, {"h": "Age", "b": "Intended for adults 18 and over."}, {"h": "Privacy", "b": "No accounts, no tracking, no analytics and no cookies. The app collects no personal information."}, {"h": "Support", "b": "If gambling is causing you harm, GambleAware NSW offers free, confidential support on 1800 858 858."}];
const HELP = {"name": "GambleAware NSW", "phone": "1800 858 858", "url": "https://www.gambleaware.nsw.gov.au", "national": "https://www.gamblinghelponline.org.au"};


/* Single- and multi-league payloads share one shape from here on. */
if (!DATA.multi) {
  DATA.leagues = [{
    id: DATA.fixtures[0]?.league_id ?? 0, name: DATA.league,
    backtest: DATA.backtest, styles: DATA.styles,
    situational: DATA.situational, ledger: DATA.ledger
  }];
  DATA.fixtures.forEach(f => { f.league_id = DATA.leagues[0].id; });
}
let ACTIVE = DATA.leagues[0]?.id ?? 0;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => Math.round(v * 100) + '%';
const pct1 = v => (v * 100).toFixed(1) + '%';
const when = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'})
    + ' · ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
};
const league = id => DATA.leagues.find(l => l.id === id) || DATA.leagues[0];
const profileOf = (lid, tid) => {
  const l = league(lid);
  return l && l.styles && l.styles.teams ? l.styles.teams[tid] : null;
};

function picker(){
  if (DATA.leagues.length < 2) return '';
  return `<div class="chips picker">` + DATA.leagues.map(l =>
    `<button class="chip ${l.id===ACTIVE?'on':''}" data-lg="${l.id}">${esc(l.name)}</button>`
  ).join('') + `</div>`;
}
function wire(root, rerender){
  root.querySelectorAll('.picker .chip').forEach(b =>
    b.addEventListener('click', () => { ACTIVE = +b.dataset.lg; rerender(); }));
}

function zbar(z){
  const c = Math.max(-2.5, Math.min(2.5, z));
  const half = Math.abs(c) / 2.5 * 50;
  return `<div class="zbar"><i class="${c<0?'neg':''}"
    style="left:${c>=0?50:50-half}%;width:${Math.max(half,1.2)}%"></i></div>`;
}
const dimVal = d => d.key === 'shot_quality' ? d.value.toFixed(1) + '%'
                 : d.key === 'discipline' ? d.value.toFixed(2)
                 : d.value.toFixed(1);

function dimRow(d, withNote){
  return `<div class="dimrow">
    <div class="dimtop"><span class="dimlab">${esc(d.label)}</span>
      <span class="dimval">${dimVal(d)}</span></div>
    ${zbar(d.z)}
    <div class="dimnote">${esc(d.descriptor)}${
      withNote && d.reading ? ' · ' + esc(d.reading) : ''}</div>
  </div>`;
}

/* -------------------------------------------------------------- fixtures */
function renderFixtures(){
  const el = document.getElementById('view-fixtures');
  const list = DATA.fixtures.filter(f => f.league_id === ACTIVE);
  const recent = (DATA.recent || []).filter(r => r.league_id === ACTIVE);
  el.innerHTML = picker() + `<div class="hd" style="margin-top:4px">Upcoming
      <em class="dim">${list.length} in the next two weeks</em></div>` +
    (list.length ? list.map(f => {
    const o = f.outcome;
    const bits = [`xG ${f.expected_goals.home}–${f.expected_goals.away}`];
    if (f.corners) bits.push(`${f.corners.expected_total} corners`);
    if (f.team_cards) bits.push(`${f.team_cards.expected_total} cards`);
    return `<button class="fx" data-id="${f.match_id}">
      <div class="ko">${when(f.kickoff)}</div>
      <div class="teams">${esc(f.home)}<span class="vs">v</span>${esc(f.away)}</div>
      <div class="bar">
        <i class="ph" style="width:${o.home*100}%"></i>
        <i class="pd" style="width:${o.draw*100}%"></i>
        <i class="pa" style="width:${o.away*100}%"></i>
      </div>
      <div class="odds"><span><b style="color:var(--accent)">${pct(o.home)}</b> home</span>
        <span><b>${pct(o.draw)}</b> draw</span>
        <span><b style="color:var(--red)">${pct(o.away)}</b> away</span></div>
      <div class="quick">${bits.join('  ·  ')}</div>
    </button>`;
  }).join('') : '<p class="dimnote">No fixtures in the next two weeks.</p>') +
    renderRecent(recent);
  wire(el, renderFixtures);
  el.querySelectorAll('.fx').forEach(b =>
    b.addEventListener('click', () => go('match-' + b.dataset.id)));
}

/* Recent results: the score next to what the model said beforehand. "ledger"
   forecasts were logged before kickoff; "replay" ones come from the backtest,
   which also only used data from before the match. */
function renderRecent(list){
  if (!list.length) return '';
  return `<section>
    <div class="hd">Recent results <em class="dim">last 7 days</em></div>
    ${list.map(r => {
      const s = r.score, o = r.outcome;
      const res = s.home > s.away ? 'home' : s.home === s.away ? 'draw' : 'away';
      let verdict = '<span class="dim">no forecast logged</span>';
      if (o) {
        const fav = Object.entries(o).sort((a,b) => b[1]-a[1])[0][0];
        /* a draw is almost never the favourite, so it is not scored as a miss */
        const tag = fav === res ? ['ok', 'called'] : res === 'draw' ? ['', 'draw'] : ['warn', 'upset'];
        verdict = `<span class="tag ${tag[0]}">${tag[1]}</span>
          <span>gave this result <b>${pct(o[res])}</b></span>`;
      }
      return `<div class="res">
        <div class="ko">${when(r.kickoff)}${r.source === 'replay'
          ? ' · <span title="Backtest forecast: data from before the match only">replay</span>' : ''}</div>
        <div class="resrow"><span class="rteam">${esc(r.home)}</span>
          <span class="rscore">${s.home}–${s.away}</span>
          <span class="rteam a">${esc(r.away)}</span></div>
        <div class="rverdict">${verdict}</div>
      </div>`;
    }).join('')}
  </section>`;
}

/* ---------------------------------------------------------------- detail */
function openDetail(id){
  const f = DATA.fixtures.find(x => x.match_id === id);
  const el = document.getElementById('view-detail');
  const o = f.outcome;
  const tc = f.team_cards;
  const top = f.scorelines[0];

  /* One table instead of three: the same players, their three markets. */
  const byPlayer = new Map();
  (f.scorers || []).forEach(s => byPlayer.set(s.player_id,
    {name:s.name, team:s.team, score:s.probability, start:s.start_probability}));
  (f.assisters || []).forEach(s => {
    const r = byPlayer.get(s.player_id) || {name:s.name, team:s.team};
    r.assist = s.probability; byPlayer.set(s.player_id, r);
  });
  (f.cards || []).forEach(s => {
    const r = byPlayer.get(s.player_id) || {name:s.name, team:s.team};
    r.card = s.probability; byPlayer.set(s.player_id, r);
  });
  const players = [...byPlayer.values()]
    .sort((a,b) => (b.score||0) - (a.score||0)).slice(0, 10);

  const lineup = side => (f.lineups[side] || []).map(p =>
    `<div class="kv"><span class="k">${esc(p.name)}
      <span class="sub2">${p.position}${p.available?'':' · out'}</span></span>
      <span class="v">${pct(p.start_probability)}</span></div>`).join('');

  el.innerHTML = `
    <div class="dbar">
      <button class="back" id="back">← Fixtures</button>
      <button class="share" id="share" aria-live="polite">Share</button>
    </div>
    <div class="dhead">
      <h2 tabindex="-1">${esc(f.home)} v ${esc(f.away)}</h2>
      <div class="dmeta">${when(f.kickoff)}${
        f.referee && f.referee !== 'TBC' ? ' · ' + esc(f.referee) : ''}</div>
    </div>

    <section>
      <div class="bar" style="height:8px">
        <i class="ph" style="width:${o.home*100}%"></i>
        <i class="pd" style="width:${o.draw*100}%"></i>
        <i class="pa" style="width:${o.away*100}%"></i>
      </div>
      <div class="odds" style="margin-bottom:12px">
        <span><b style="color:var(--accent)">${pct1(o.home)}</b> ${esc(f.home)}</span>
        <span><b>${pct1(o.draw)}</b> draw</span>
        <span><b style="color:var(--red)">${pct1(o.away)}</b> ${esc(f.away)}</span>
      </div>
      <div class="kv"><span class="k">Expected goals</span>
        <span class="v">${f.expected_goals.home} – ${f.expected_goals.away}</span></div>
      <div class="kv"><span class="k">Over 2.5 goals</span>
        <span class="v">${pct(f.totals.over)}</span></div>
      <div class="kv"><span class="k">Both teams score</span>
        <span class="v">${pct(f.btts)}</span></div>
      ${f.corners ? `<div class="kv"><span class="k">Corners</span>
        <span class="v">${f.corners.expected_total}
          <small>over ${f.corners.line} ${pct(f.corners.over)}</small></span></div>` : ''}
      ${tc ? `<div class="kv"><span class="k">Cards</span>
        <span class="v">${tc.expected_total}
          <small>over 3.5 ${pct(tc.over_3_5)}</small></span></div>` : ''}
    </section>

    <section>
      <div class="hd">Likeliest scores</div>
      <div class="scores">${f.scorelines.slice(0,4).map(s =>

    </section>

    ${f.has_players && players.length ? `
    <section>
      <div class="hd">Players <em class="dim">chance of each</em></div>
      <div class="scroller"><table>
        <thead><tr><th>Player</th><th>Score</th><th>Assist</th><th>Card</th></tr></thead>
        <tbody>${players.map(p => `<tr>
          <td><span class="who">${esc(p.name)}</span>
            <span class="sub2"> ${esc(p.team)}</span></td>
          <td>${p.score != null ? pct(p.score) : '<span class="dim">–</span>'}</td>
          <td>${p.assist != null ? pct(p.assist) : '<span class="dim">–</span>'}</td>
          <td>${p.card != null ? pct(p.card) : '<span class="dim">–</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <details><summary>Predicted lineups</summary>
        <div class="body"><div class="cols">
          <div class="col"><div class="hd">${esc(f.home)}</div>${lineup('home')}</div>

        </div></div>
      </details>

    ${f.style_detail && f.style_detail.home ? `
    <section>
      <div class="hd">Style</div>
      ${['home','away'].map(side => {
        const s = f.style_detail[side];
        if (!s) return '';
        const prof = profileOf(f.league_id, s.team_id);
        const dims = prof ? s.top_dimension_keys
          .map(k => prof.dimensions.find(d => d.key === k)).filter(Boolean) : [];
        const adapts = s.adapts_here || [];
        return `<details class="card">
          <summary><span class="cname">${esc(s.name)}</span>
            <span class="cmeta">${esc(s.style.split(', ').slice(0,2).join(', '))}${
              adapts.length ? ` <span class="tag ${
                adapts[0].confidence==='confirmed'?'ok':'warn'}">shifts here</span>` : ''}</span>
          </summary>
          <div class="cbody">
            ${dims.map(d => dimRow(d, true)).join('')}
            <div class="dimnote" style="margin-top:10px">${

          </div>

      }).join('')}
      <div class="dimnote">${esc(f.style_detail.matchup || '')}</div>
    </section>` : ''}

    <details>
      <summary>How to read this</summary>
      <div class="body">
        <p><b>Probabilities, not tips.</b> These are statistical estimates
        about future events, not predictions of fact and not advice to bet.
        Every one was written to a ledger before kickoff and is scored on the
        Accuracy tab, so the grounds for them are published rather than
        claimed.</p>
        ${f.has_players ? `<p><b>Player numbers</b> use each player's own rate
        adjusted for this opponent's defence. Head-to-head records are shown on
        the Styles tab but barely weighted: four to eight career meetings cannot
        support a reliable per-player effect.</p>
        <p><b>Lineups</b> come from recent selection only. No press conferences,
        no late fitness tests — about 7 of 11 correct on held-out matches.</p>` : ''}
        ${tc && !tc.referee_matches ? `<p><b>The referee is not yet appointed.</b>
        Card numbers use team rates only and will move once it is, often a lot.</p>` : ''}
      </div>
    </details>`;

  document.getElementById('back').addEventListener('click', () => go(''));
  document.getElementById('share').addEventListener('click', async e => {
    const b = e.currentTarget;
    const text = `${f.home} v ${f.away}: ${pct(o.home)} home · ${pct(o.draw)} draw · ${
      pct(o.away)} away`;
    try {
      if (navigator.share) { await navigator.share({title: 'PitchLab', text, url: location.href}); return; }
      await navigator.clipboard.writeText(location.href);
      b.textContent = 'Link copied';
    } catch (err) {
      if (err && err.name === 'AbortError') return;      // closed the share sheet
      b.textContent = 'Copy the address bar';
    }
    setTimeout(() => { b.textContent = 'Share'; }, 2200);
  });
  document.title = `${f.home} v ${f.away} · PitchLab`;
  show('detail'); window.scrollTo(0,0);

/* -------------------------------------------------------------- accuracy */
function renderAccuracy(){
  const el = document.getElementById('view-accuracy');
  const lg = league(ACTIVE);
  const b = lg && lg.backtest;
  if (!b || !b.n_matches){
    el.innerHTML = picker() + '<p>No backtest for this league.</p>';
    wire(el, renderAccuracy); return;
  }
  const led = lg.ledger || {n:0};
  el.innerHTML = picker() + `
    <section style="margin-top:4px">
      <div class="bigrow">
        <div><div class="biglab">Skill over baseline</div>
          <div class="big" style="color:var(--accent)">${(b.skill_vs_baseline*100).toFixed(1)}%</div></div>
        <div><div class="biglab">Calibration error</div>
          <div class="big">${b.calibration_error.toFixed(3)}</div></div>
      </div>
      <div class="kv"><span class="k">Log loss</span>
        <span class="v">${b.log_loss.toFixed(3)}<small>vs ${b.baseline_log_loss.toFixed(3)}</small></span></div>
      <div class="kv"><span class="k">Brier score</span>
        <span class="v">${b.brier.toFixed(3)}<small>vs ${b.baseline_brier.toFixed(3)}</small></span></div>
      <div class="kv"><span class="k">Matches tested</span>
        <span class="v">${b.n_matches}<small>${pct1(b.accuracy)} called right</small></span></div>
    </section>

    <section>
      <div class="hd">Calibration <em class="dim">home win</em></div>
      ${reliability(b.reliability_home)}
      <div class="legend"><span><i style="background:var(--accent)"></i>Observed</span>
        <span><i style="background:var(--faint)"></i>Perfect</span></div>
      <div class="dimnote" style="margin-top:8px">Bars on the diagonal mean a stated
        70% happens about 70% of the time.</div>
    </section>

    <section>
      <div class="hd">Live ledger</div>
      <div class="dimnote">${led.n
        ? `${led.n} settled · log loss ${led.log_loss}${led.calibration_error != null
            ? ` · calibration error ${led.calibration_error}`
            : ` · calibration shown from 50 settled`}`
        : 'Nothing settled yet. Forecasts are written before kickoff and scored when the match finishes.'}</div>
      <details><summary>What these numbers mean</summary>
        <div class="body">
          <p><b>Skill over baseline</b> compares the model against always
          predicting the league's average home/draw/away split. Single digits is
          what a good football model looks like.</p>
          <p><b>Log loss</b> is the real score. Accuracy is shown for sanity only:
          with about a quarter of matches drawn, calling the winner is a poor test
          of whether the probabilities are right.</p>
          <p>Every match was predicted using only data dated before it.</p>
          ${Object.values(DATA.model_notes || {}).map(n => `<p>${esc(n)}</p>`).join('')}
        </div>
      </details>
    </section>`;
  wire(el, renderAccuracy);
}

function reliability(rel){
  const W=320,H=190,P=30,R=14,iw=W-P-R,ih=H-P-8;
  const x=v=>P+v*iw, y=v=>H-P-v*ih;
  const ticks=[0,.5,1].map(t=>`
    <line x1="${P}" y1="${y(t)}" x2="${W-R}" y2="${y(t)}" stroke="var(--line)"/>
    <text x="${P-5}" y="${y(t)+3.5}" fill="var(--faint)" font-size="9"
      font-family="IBM Plex Mono, monospace" text-anchor="end">${t.toFixed(1)}</text>
    <text x="${x(t)}" y="${H-P+13}" fill="var(--faint)" font-size="9"
      font-family="IBM Plex Mono, monospace" text-anchor="middle">${t.toFixed(1)}</text>`).join('');
  const bars=(rel||[]).map(r=>{
    const cx=x((r.bin_low+r.bin_high)/2), bw=Math.max(iw/13,7);
    return `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(r.observed).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${Math.max(H-P-y(r.observed),1).toFixed(1)}"
      fill="var(--accent)" opacity=".85" rx="2"/>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Predicted probability against observed frequency">
    ${ticks}
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--faint)"
      stroke-width="1.2" stroke-dasharray="3 3"/>
    ${bars}
  </svg>`;
}

/* ---------------------------------------------------------------- styles */
function renderStyles(){
  const el = document.getElementById('view-styles');
  const lg = league(ACTIVE);
  const st = lg && lg.styles;
  const sit = (lg && lg.situational) || {teams:{}};
  if (!st || !st.teams || !Object.keys(st.teams).length){
    el.innerHTML = picker() + '<p>No style profiles for this league.</p>';
    wire(el, renderStyles); return;
  }
  const teams = Object.values(st.teams).sort((a,b)=>a.name.localeCompare(b.name));
  const yes = Object.values(sit.teams||{}).filter(t=>t.adapts);
  const maybe = Object.values(sit.teams||{}).filter(t=>t.adapts_weakly);

  el.innerHTML = picker() + `
    <section style="margin-top:4px">
      <div class="hd">Do they change it by fixture?</div>
      <div class="dimnote">
        ${yes.length ? `<b style="color:var(--accent)">${yes.map(t=>esc(t.name)).join(', ')}</b>
          shift beyond what every side does away or against better teams. ` : ''}
        ${maybe.length ? `${yes.length?'':'Nobody clears the bar. '}Weaker evidence for
          ${maybe.map(t=>esc(t.name)).join(', ')}.` : (yes.length?'':'No side shows a shift beyond the league norm.')}
      </div>
      <details><summary>Why so few</summary>
        <div class="body">
          <p>${esc(sit.baseline_note || '')}</p>
          <p>Testing every side on every dimension in every situation is
          ${sit.tests_run || 0} comparisons. At a normal threshold about one in
          twenty fires by chance, so these are corrected for that. On a few
          seasons of data most apparent tactical switches cannot be told apart
          from noise.</p>
        </div>
      </details>
    </section>

    <section>
      <div class="hd">Teams <em class="dim">last ${st.window} matches</em></div>
      ${teams.map(t => {
        const s = (sit.teams||{})[t.team_id] || {};
        return `<details class="card">
          <summary><span class="cname">${esc(t.name)}</span>
            <span class="cmeta">${esc(t.style.split(', ').slice(0,2).join(', '))}${
              s.adapts ? ' <span class="tag ok">shifts</span>'
              : s.adapts_weakly ? ' <span class="tag warn">maybe</span>' : ''}</span>
          </summary>
          <div class="cbody">
            ${t.dimensions.map(d => dimRow(d, true)).join('')}
            <div class="dimnote" style="margin-top:10px">${esc(s.verdict || '')}</div>
          </div>
        </details>`;
      }).join('')}
    </section>

    <details>
      <summary>What the measures mean</summary>
      <div class="body">
        <p>Each bar is centred on the league average — right is above it, left
        below. All eight come from shots, shots on target, corners, fouls and
        cards, recomputed every run.</p>
        ${(st.dimensions||[]).map(d => `<p><b style="color:var(--fg)">${esc(d.label)}</b>
          <span class="dim">${esc(d.unit)}</span> — ${esc(d.meaning)}</p>`).join('')}
      </div>
    </details>`;
  wire(el, renderStyles);
}

/* ---------------------------------------------------------------- router */
const VIEWS = ['fixtures','detail','accuracy','styles','legal'];
function show(v){
  VIEWS.forEach(n => document.getElementById('view-'+n).hidden = (n !== v));
  ['fixtures','accuracy','styles'].forEach(n =>
    document.getElementById('t-'+n).setAttribute('aria-selected',
      String(n === (v === 'detail' || v === 'legal' ? 'fixtures' : v))));
}
['fixtures','accuracy','styles'].forEach(n =>
  document.getElementById('t-'+n).addEventListener('click', () => go(n === 'fixtures' ? '' : n)));

/* Every view has its own address (#accuracy, #styles, #legal, #match-123),
   so a match can be shared and the phone's back button works. */
const TITLE = document.title;
function go(hash){
  if (hash) { if (location.hash !== '#' + hash) location.hash = hash; else route(); }
  else { history.pushState(null, '', location.pathname + location.search); route(); }
}
function route(){
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^match-(\d+)$/);
  if (m) {
    const f = DATA.fixtures.find(x => x.match_id === +m[1]);
    if (f) { ACTIVE = f.league_id; openDetail(f.match_id); return; }
  }
  document.title = TITLE;
  if (h === 'legal') { openLegal(); return; }
  const v = ['accuracy','styles'].includes(h) ? h : 'fixtures';
  ({fixtures:renderFixtures, accuracy:renderAccuracy, styles:renderStyles})[v]();
  show(v); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);

/* "Updated 3h ago" in the header, so a stale build is obvious at a glance. */
const ago = iso => {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  return m < 60 ? `${m}m ago` : m < 2880 ? `${Math.round(m/60)}h ago` : `${Math.round(m/1440)}d ago`;
};
document.getElementById('sub').textContent = DATA.data_source === 'replay'
  ? 'Test replay'
  : `Updated ${ago(DATA.generated_at)}`;
if (Date.now() - new Date(DATA.generated_at) > 36 * 3600e3)
  document.getElementById('sub').style.color = 'var(--warn)';   // missed runs show
document.getElementById('foot').innerHTML =
  `${DATA.data_source === 'synthetic'
      ? '<b style="color:var(--warn)">Simulated data</b> — not real matches. '
      : DATA.data_source === 'replay'
      ? `<b style="color:var(--warn)">Test replay</b> — the site as it would have looked on ${
          new Date(DATA.as_of).toLocaleDateString()}, built from real past results. `
      : 'Free data: football-data.co.uk, openfootball, FPL. No API key. '}
   Model ${esc(DATA.model_version)} · ${when(DATA.generated_at)}
   <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
     <b style="color:var(--muted)">Information only · 18+</b><br>
     Statistical estimates, not guarantees, and not betting advice. No bets are
     taken or facilitated here.<br>
     Gambling harm support: ${esc(HELP.name)}
     <span class="n">${esc(HELP.phone)}</span>.
     <div style="margin-top:8px">
       <button id="legalbtn" class="chip" style="cursor:pointer">Legal &amp; responsible use</button>
     </div>
   </div>`;

document.getElementById('legalbtn').addEventListener('click', () => go('legal'));
function openLegal(){
  const el = document.getElementById('view-legal');
  el.innerHTML = `<button class="back" id="legalback">← Back</button>
    <div class="dhead"><h2>Legal &amp; responsible use</h2>
      <div class="dmeta">Australian Consumer Law · NSW gambling advertising rules</div></div>
    <section>
      ${LEGAL.map(x => `<div style="margin-bottom:14px">
        <div class="hd">${esc(x.h)}</div>
        <div class="dimnote" style="font-size:12.5px">${esc(x.b)}</div>
      </div>`).join('')}
      <div class="hd">Where to get help</div>
      <div class="dimnote" style="font-size:12.5px">
        ${esc(HELP.name)} — <span class="n">${esc(HELP.phone)}</span>, free and
        confidential.<br>
        <a href="${esc(HELP.url)}" style="color:var(--accent)">${esc(HELP.url)}</a><br>
        <a href="${esc(HELP.national)}" style="color:var(--accent)">${esc(HELP.national)}</a>
      </div>
    </section>`;
  document.getElementById('legalback').addEventListener('click', () => go(''));
  document.title = `Legal & responsible use · PitchLab`;
  show('legal'); window.scrollTo(0,0);
}

route();

/* Offline support and "Add to Home Screen" install. */
if ('serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
