name: Daily build

on:
  schedule:
    # Every six hours. GitHub's free scheduler sometimes runs late or drops a
    # run at busy times; four chances a day means a missed one never matters.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "tests/**", "requirements*.txt", ".github/workflows/**"]

permissions:
  contents: write           # commit the ledger back
  pages: write
  id-token: write

concurrency:
  group: pitchlab-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build from the newest main, not the commit that triggered the
          # run, so the ledger includes whatever the previous run just committed.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      - name: Build site
        run: python -m pipeline.build --out public

      - name: Commit ledger and heartbeat
        run: |
          git config user.name  "pitchlab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A commit on every run keeps the repo "active": GitHub switches off
          # scheduled workflows after 60 days without activity (e.g. the summer break).
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/last_run.txt
          git add data/ledger.json data/last_run.txt
          if git diff --cached --quiet; then
            echo "Ledger unchanged"
          else
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M') UTC"
            # runs are serialised (concurrency group), so this only matters if a
            # human pushed mid-run; keep the bot's ledger if both touched it
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
